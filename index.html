<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIFF</title>
<link rel="icon" href="img/favicon.ico">
<style>
  /* ---------- Design tokens: monochrome editorial + one rouge accent ---------- */
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #f6f6f6;
    --border: #111111;
    --border-soft: #e2e2e2;
    --text: #111111;
    --text-dim: #6b6b6b;
    --text-faint: #9a9a9a;
    --rouge: #fa543a;
    --rouge-hover: #d5472f;
    --rouge-ink: #fff5f6;
    --add: #111111;
    --add-bg: rgba(59, 130, 246, 0.08);
    --add-bg-strong: rgba(59, 130, 246, 0.24);
    --del: #fa543a;
    --del-bg: rgba(250, 84, 58, 0.08);
    --del-bg-strong: rgba(250, 84, 58, 0.24);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    --focus-ring: 0 0 0 3px rgba(250, 84, 58, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0c;
      --surface: #141415;
      --surface-alt: #1b1b1d;
      --border: #f2f2f2;
      --border-soft: #2c2c2e;
      --text: #f2f2f2;
      --text-dim: #a8a8a8;
      --text-faint: #737373;
      --rouge: #fa543a;
      --rouge-hover: #fb7661;
      --rouge-ink: #1c0704;
      --add: #f2f2f2;
      --add-bg: rgba(59, 130, 246, 0.16);
      --add-bg-strong: rgba(59, 130, 246, 0.34);
      --del: #fa543a;
      --del-bg: rgba(250, 84, 58, 0.16);
      --del-bg-strong: rgba(250, 84, 58, 0.34);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      --focus-ring: 0 0 0 3px rgba(250, 84, 58, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b0b0c;
    --surface: #141415;
    --surface-alt: #1b1b1d;
    --border: #f2f2f2;
    --border-soft: #2c2c2e;
    --text: #f2f2f2;
    --text-dim: #a8a8a8;
    --text-faint: #737373;
    --rouge: #fa543a;
    --rouge-hover: #fb7661;
    --rouge-ink: #1c0704;
    --add: #f2f2f2;
    --add-bg: rgba(59, 130, 246, 0.16);
    --add-bg-strong: rgba(59, 130, 246, 0.34);
    --del: #fa543a;
    --del-bg: rgba(250, 84, 58, 0.16);
    --del-bg-strong: rgba(250, 84, 58, 0.34);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    --focus-ring: 0 0 0 3px rgba(250, 84, 58, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1360px;
    margin: 0 auto;
    padding: 48px 28px 80px;
  }

  /* ---------- Masthead ---------- */
  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    text-align: center;
    margin-bottom: 48px;
  }

  .masthead-top img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .masthead-text h1 {
    font-family: "Didot", "Bodoni MT", "Bodoni 72", Georgia, serif;
    font-size: 52px;
    font-weight: 700;
    -webkit-text-stroke: 0.4px currentColor;
    letter-spacing: 0.01em;
    margin: 0;
    text-wrap: balance;
    color: var(--text);
  }

  /* ---------- Input panel ---------- */
  .input-panel {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 0;
  }

  .paper {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    border-top: 2px solid var(--border);
  }

  .paper-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 12px 4px;
  }

  .paper-head .label {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text);
  }

  .paper-head .count {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    color: var(--text-faint);
  }

  .paper textarea {
    flex: 1;
    resize: vertical;
    min-height: 300px;
    border: 1px solid var(--border-soft);
    outline: none;
    padding: 16px 4px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 0.92rem;
    line-height: 1.7em;
    color: var(--text);
    background: var(--surface);
  }

  .paper textarea::placeholder { color: var(--text-faint); }

  .seam {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 96px;
    position: relative;
  }

  .seam::before {
    content: "";
    position: absolute;
    top: 44px;
    bottom: 8px;
    left: 50%;
    width: 1px;
    background: var(--border-soft);
  }

  .stamp-btn {
    position: relative;
    z-index: 1;
    padding: 14px 10px;
    min-width: 74px;
    border: none;
    background: var(--rouge);
    color: var(--rouge-ink);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    line-height: 1.4;
    box-shadow: var(--shadow);
    transition: background 0.12s ease, transform 0.12s ease;
  }

  .stamp-btn:hover { background: var(--rouge-hover); transform: translateY(-1px); }
  .stamp-btn:active { transform: translateY(0); }
  .stamp-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* ---------- Controls row ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }

  .option-group {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .toggle-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    user-select: none;
  }

  .toggle-pill input {
    appearance: none;
    width: 14px;
    height: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: inline-block;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .toggle-pill input:checked { background: var(--text); }
  .toggle-pill input:checked::after {
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 3px; height: 7px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .toggle-pill.checked { color: var(--text); font-weight: 600; }
  .toggle-pill input:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .btn-row { display: flex; gap: 4px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    font-family: inherit;
  }

  .btn:hover { border-color: var(--text); color: var(--text); }
  .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .view-toggle {
    display: inline-flex;
    gap: 20px;
  }

  .view-toggle button {
    border: none;
    background: transparent;
    color: var(--text-faint);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: inherit;
  }

  .view-toggle button.active {
    color: var(--text);
    border-bottom-color: var(--rouge);
  }

  .view-toggle button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* ---------- Stats ---------- */
  .stats-bar {
    display: none;
    gap: 0;
    margin-top: 28px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border-soft);
  }

  .stats-bar.visible { display: flex; }

  .stat-chip {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px 18px;
    border-left: 1px solid var(--border-soft);
    border-top: none;
    border-right: none;
    border-bottom: none;
    background: transparent;
    font: inherit;
    text-align: left;
    color: inherit;
    margin: 0;
  }

  .stat-chip:first-child { border-left: none; }

  button.stat-chip {
    cursor: pointer;
    transition: background 0.12s ease;
  }

  button.stat-chip:hover:not(:disabled) { background: var(--surface-alt); }
  button.stat-chip:hover:not(:disabled) strong { text-decoration: underline; }
  button.stat-chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  button.stat-chip:disabled { cursor: default; opacity: 0.4; }

  .stat-chip span {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .stat-chip strong {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
  }

  .stat-chip.add strong { color: var(--add); }
  .stat-chip.del strong { color: var(--del); }

  .grid-row.flash > div { animation: flash-row 1.1s ease; }

  @keyframes flash-row {
    0%, 100% { box-shadow: inset 0 0 0 9999px transparent; }
    20% { box-shadow: inset 0 0 0 9999px var(--del-bg-strong); }
  }

  @media (prefers-reduced-motion: reduce) {
    .grid-row.flash > div { animation: none; }
  }
  .stat-chip.accent strong { color: var(--rouge); }

  /* ---------- Result ---------- */
  .result-wrap { margin-top: 22px; }

  .result-empty {
    padding: 56px 24px;
    text-align: center;
    color: var(--text-faint);
    border: 1px dashed var(--border-soft);
    font-size: 0.88rem;
    letter-spacing: 0.02em;
  }

  .result-card {
    display: none;
    border-top: 2px solid var(--border);
  }

  .result-card.visible { display: block; }

  .result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .result-scroll {
    overflow-x: auto;
    border-top: 1px solid var(--border-soft);
  }

  .diff-grid {
    display: grid;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 0.88rem;
    line-height: 1.65em;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Side view mirrors the input panel above: [A: 行番号 + 本文] [96px seam] [B: 行番号 + 本文] */
  .diff-grid.side { grid-template-columns: 52px minmax(0, 1fr) 96px 52px minmax(0, 1fr); }
  .diff-grid.unified { grid-template-columns: 46px 46px 22px minmax(0, 1fr); }

  .diff-grid .ln,
  .diff-grid .cell,
  .diff-grid .marker {
    padding: 1px 10px;
  }

  .ln {
    text-align: right;
    color: var(--text-faint);
    user-select: none;
    font-variant-numeric: tabular-nums;
    background: var(--surface-alt);
    border-right: 1px solid var(--border-soft);
  }

  .marker { text-align: center; user-select: none; font-weight: 700; }

  .cell { color: var(--text); }
  .cell.blank-a, .ln.blank-a {
    background: #ff8673;
  }

  .cell.blank-b, .ln.blank-b {
    background: #79a3ff;
  }

  .row-equal.cell { color: var(--text-dim); }

  .row-add.cell, .row-add.marker { background: var(--add-bg); }
  .row-add.marker { color: var(--add); }
  .row-add.ln { background: var(--add-bg); }

  .row-del.cell { background: var(--del-bg); }
  .row-del.marker { color: var(--del); }
  .row-del.ln { background: var(--del-bg); }

  .row-mod-del.cell { background: var(--del-bg); }
  .row-mod-del.ln { background: var(--del-bg); }
  .row-mod-add.cell { background: var(--add-bg); }
  .row-mod-add.ln { background: var(--add-bg); }
  .row-mod-del.marker { color: var(--del); }
  .row-mod-add.marker { color: var(--add); }

  mark.ins {
    background: var(--add-bg-strong);
    color: var(--text);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    border-radius: 0;
    padding: 0 1px;
  }

  mark.del {
    background: var(--del-bg-strong);
    color: var(--text);
    text-decoration: line-through;
    text-decoration-color: var(--del);
    text-decoration-thickness: 2px;
    border-radius: 0;
    padding: 0 1px;
  }

  footer.note {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
    color: var(--text-faint);
    font-size: 0.76rem;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .to-top-btn {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: #111111;
    color: #ffffff;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity 0.15s ease, transform 0.15s ease, background 0.12s ease;
    z-index: 10;
  }

  .to-top-btn.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .to-top-btn:hover { background: var(--rouge); }
  .to-top-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  @media (prefers-reduced-motion: reduce) {
    .to-top-btn { transition: opacity 0.01s linear; }
  }

  @media (max-width: 860px) {
    .masthead-top { flex-direction: column; align-items: center; gap: 16px; }
    .masthead-top img { width: 120px; height: 120px; }
    .masthead-text h1 { font-size: 40px; }
    .input-panel { grid-template-columns: 1fr; }
    .seam { width: 100%; padding: 14px 0; }
    .seam::before { display: none; }
    .diff-grid.side { grid-template-columns: 40px minmax(0, 1fr); }
    .diff-grid.side .gap { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="masthead-top">
      <img src="img/img.png" width="200" height="200" alt="DIFF">
      <div class="masthead-text">
        <h1>DIFF</h1>
      </div>
    </div>
  </header>

  <section class="input-panel">
    <div class="paper a">
      <div class="paper-head">
        <span class="label">変更前 — A</span>
        <span class="count" id="countA">0 文字</span>
      </div>
      <textarea id="textA" placeholder="比較したい元の文章を貼り付けてください。1万文字以上でも比較できます。" spellcheck="false"></textarea>
    </div>
    <div class="seam">
      <button class="stamp-btn" id="compareBtn" title="差分を比較する">比較する</button>
    </div>
    <div class="paper b">
      <div class="paper-head">
        <span class="label">変更後 — B</span>
        <span class="count" id="countB">0 文字</span>
      </div>
      <textarea id="textB" placeholder="比較したい変更後の文章を貼り付けてください。" spellcheck="false"></textarea>
    </div>
  </section>

  <div class="controls">
    <div class="option-group">
      <label class="toggle-pill" id="pillCase">
        <input type="checkbox" id="ignoreCase">大文字・小文字を無視
      </label>
      <label class="toggle-pill" id="pillSpace">
        <input type="checkbox" id="ignoreWhitespace">空白の違いを無視
      </label>
      <div class="view-toggle" role="group" aria-label="表示モード">
        <button type="button" id="viewSide" class="active">左右比較</button>
        <button type="button" id="viewUnified">統合表示</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="sampleBtn">サンプルを読込</button>
      <button class="btn" id="swapBtn">A/B を入替</button>
      <button class="btn" id="clearBtn">クリア</button>
      <button class="btn" id="copyBtn">結果をコピー</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-chip accent"><span>類似度</span><strong id="statSim">–</strong></div>
    <button type="button" class="stat-chip add" id="linkAdd" title="最初の追加箇所へ移動" disabled><span>追加</span><strong id="statAdd">0 行</strong></button>
    <button type="button" class="stat-chip del" id="linkDel" title="最初の削除箇所へ移動" disabled><span>削除</span><strong id="statDel">0 行</strong></button>
    <button type="button" class="stat-chip" id="linkMod" title="最初の変更箇所へ移動" disabled><span>変更</span><strong id="statMod">0 行</strong></button>
    <div class="stat-chip"><span>文字数</span><strong id="statChars">A 0 / B 0</strong></div>
  </div>

  <div class="result-wrap">
    <div class="result-empty" id="resultEmpty">比較を実行すると、ここに差分が表示されます。</div>
    <div class="result-card" id="resultCard">
      <div class="result-head">
        <span id="resultHeadLabel">左右比較表示</span>
        <span id="resultHeadHint">薄い塗りは行単位の変更、濃い塗りと下線・打ち消し線は文字単位の変更です。</span>
      </div>
      <div class="result-scroll">
        <div class="diff-grid side" id="diffGrid"></div>
      </div>
    </div>
  </div>

  <footer class="note">文字数・行数に上限はありません。長大な文章では中央の差分部分のみを解析するため高速に動作します。</footer>
</div>

<button type="button" class="to-top-btn" id="toTopBtn" title="ページトップへ戻る" aria-label="ページトップへ戻る">↑</button>

<script>
(function () {
  'use strict';

  /* ================= Diff core (LCS with prefix/suffix trimming) ================= */

  function diffArraysRaw(a, b, eq, cellLimit) {
    const n = a.length, m = b.length;
    if (n === 0 && m === 0) return [];
    if ((n + 1) * (m + 1) > cellLimit) {
      const res = [];
      for (let i = 0; i < n; i++) res.push({ type: 'delete', aIndex: i });
      for (let j = 0; j < m; j++) res.push({ type: 'insert', bIndex: j });
      return res;
    }
    const stride = m + 1;
    const dp = new Uint32Array((n + 1) * stride);
    for (let i = n - 1; i >= 0; i--) {
      const rowCur = i * stride;
      const rowNext = (i + 1) * stride;
      for (let j = m - 1; j >= 0; j--) {
        if (eq(a[i], b[j])) {
          dp[rowCur + j] = dp[rowNext + j + 1] + 1;
        } else {
          const down = dp[rowNext + j];
          const right = dp[rowCur + j + 1];
          dp[rowCur + j] = down > right ? down : right;
        }
      }
    }
    const result = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (eq(a[i], b[j])) {
        result.push({ type: 'equal', aIndex: i, bIndex: j });
        i++; j++;
      } else if (dp[(i + 1) * stride + j] >= dp[i * stride + (j + 1)]) {
        result.push({ type: 'delete', aIndex: i });
        i++;
      } else {
        result.push({ type: 'insert', bIndex: j });
        j++;
      }
    }
    while (i < n) { result.push({ type: 'delete', aIndex: i }); i++; }
    while (j < m) { result.push({ type: 'insert', bIndex: j }); j++; }
    return result;
  }

  function diffWithTrim(a, b, eq, cellLimit) {
    const n = a.length, m = b.length;
    const minLen = Math.min(n, m);
    let prefix = 0;
    while (prefix < minLen && eq(a[prefix], b[prefix])) prefix++;
    let suffix = 0;
    while (suffix < minLen - prefix && eq(a[n - 1 - suffix], b[m - 1 - suffix])) suffix++;

    const aMid = a.slice(prefix, n - suffix);
    const bMid = b.slice(prefix, m - suffix);
    const midResult = diffArraysRaw(aMid, bMid, eq, cellLimit);

    const result = [];
    for (let k = 0; k < prefix; k++) result.push({ type: 'equal', aIndex: k, bIndex: k });
    for (const op of midResult) {
      if (op.type === 'equal') result.push({ type: 'equal', aIndex: op.aIndex + prefix, bIndex: op.bIndex + prefix });
      else if (op.type === 'delete') result.push({ type: 'delete', aIndex: op.aIndex + prefix });
      else result.push({ type: 'insert', bIndex: op.bIndex + prefix });
    }
    for (let k = 0; k < suffix; k++) {
      result.push({ type: 'equal', aIndex: n - suffix + k, bIndex: m - suffix + k });
    }
    return result;
  }

  const LINE_CELL_LIMIT = 4_000_000;   // ~16MB Uint32Array cap for line-level LCS
  const CHAR_CELL_LIMIT = 1_000_000;   // ~4MB cap for per-line-pair character LCS

  /* ================= Helpers ================= */

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function splitLines(text) {
    if (text === '') return [''];
    return text.split(/\r\n|\r|\n/);
  }

  function makeNormalizer(ignoreCase, ignoreWhitespace) {
    return function (line) {
      let s = line;
      if (ignoreWhitespace) s = s.replace(/\s+/g, ' ').trim();
      if (ignoreCase) s = s.toLowerCase();
      return s;
    };
  }

  function makeCharEq(ignoreCase, ignoreWhitespace) {
    return function (x, y) {
      if (x === y) return true;
      if (ignoreWhitespace) {
        const wx = /\s/.test(x), wy = /\s/.test(y);
        if (wx && wy) return true;
      }
      if (ignoreCase && x.toLowerCase() === y.toLowerCase()) return true;
      return false;
    };
  }

  /* ================= Char-level sub-diff for a modified line pair ================= */

  function charDiffLine(oldLine, newLine, ignoreCase, ignoreWhitespace) {
    const a = Array.from(oldLine);
    const b = Array.from(newLine);
    const eq = makeCharEq(ignoreCase, ignoreWhitespace);
    const ops = diffWithTrim(a, b, eq, CHAR_CELL_LIMIT);
    let oldHtml = '', newHtml = '';
    let equalCount = 0;
    let i = 0;
    while (i < ops.length) {
      const op = ops[i];
      if (op.type === 'equal') {
        oldHtml += escapeHtml(a[op.aIndex]);
        newHtml += escapeHtml(b[op.bIndex]);
        equalCount++;
        i++;
      } else if (op.type === 'delete') {
        let s = '';
        while (i < ops.length && ops[i].type === 'delete') { s += a[ops[i].aIndex]; i++; }
        oldHtml += '<mark class="del">' + escapeHtml(s) + '</mark>';
      } else {
        let s = '';
        while (i < ops.length && ops[i].type === 'insert') { s += b[ops[i].bIndex]; i++; }
        newHtml += '<mark class="ins">' + escapeHtml(s) + '</mark>';
      }
    }
    return { oldHtml, newHtml, equalCount, oldLen: a.length, newLen: b.length };
  }

  /* ================= Build row model from line-level diff ops ================= */

  function buildRows(linesA, linesB, ignoreCase, ignoreWhitespace) {
    const normalize = makeNormalizer(ignoreCase, ignoreWhitespace);
    const eq = (x, y) => normalize(x) === normalize(y);
    const ops = diffWithTrim(linesA, linesB, eq, LINE_CELL_LIMIT);

    const rows = [];
    const stats = { added: 0, deleted: 0, modified: 0, matchedChars: 0, totalCharsA: 0, totalCharsB: 0 };

    let i = 0;
    while (i < ops.length) {
      const op = ops[i];
      if (op.type === 'equal') {
        const line = linesA[op.aIndex];
        rows.push({ kind: 'equal', aNum: op.aIndex + 1, bNum: op.bIndex + 1, aHtml: escapeHtml(line), bHtml: escapeHtml(line) });
        stats.matchedChars += line.length * 2;
        stats.totalCharsA += line.length;
        stats.totalCharsB += line.length;
        i++;
        continue;
      }
      // gather a contiguous block of delete/insert ops
      const dels = [];
      const inss = [];
      while (i < ops.length && ops[i].type === 'delete') { dels.push(ops[i].aIndex); i++; }
      while (i < ops.length && ops[i].type === 'insert') { inss.push(ops[i].bIndex); i++; }

      const pairCount = Math.min(dels.length, inss.length);
      for (let k = 0; k < pairCount; k++) {
        const oldLine = linesA[dels[k]];
        const newLine = linesB[inss[k]];
        stats.totalCharsA += oldLine.length;
        stats.totalCharsB += newLine.length;
        if (normalize(oldLine) === normalize(newLine)) {
          // whitespace/case-only difference under current options: treat as equal-ish, but show raw text
          rows.push({ kind: 'equal', aNum: dels[k] + 1, bNum: inss[k] + 1, aHtml: escapeHtml(oldLine), bHtml: escapeHtml(newLine) });
          stats.matchedChars += Math.min(oldLine.length, newLine.length) * 2;
          continue;
        }
        const combined = oldLine.length + newLine.length;
        stats.modified++;
        if (combined <= 6000) {
          const cd = charDiffLine(oldLine, newLine, ignoreCase, ignoreWhitespace);
          rows.push({ kind: 'mod', aNum: dels[k] + 1, bNum: inss[k] + 1, aHtml: cd.oldHtml, bHtml: cd.newHtml });
          stats.matchedChars += cd.equalCount * 2;
        } else {
          rows.push({ kind: 'mod', aNum: dels[k] + 1, bNum: inss[k] + 1, aHtml: escapeHtml(oldLine), bHtml: escapeHtml(newLine) });
        }
      }
      for (let k = pairCount; k < dels.length; k++) {
        const line = linesA[dels[k]];
        rows.push({ kind: 'del', aNum: dels[k] + 1, bNum: null, aHtml: escapeHtml(line), bHtml: null });
        stats.deleted++;
        stats.totalCharsA += line.length;
      }
      for (let k = pairCount; k < inss.length; k++) {
        const line = linesB[inss[k]];
        rows.push({ kind: 'add', aNum: null, bNum: inss[k] + 1, aHtml: null, bHtml: escapeHtml(line) });
        stats.added++;
        stats.totalCharsB += line.length;
      }
    }
    return { rows, stats };
  }

  /* ================= Rendering ================= */

  const els = {
    textA: document.getElementById('textA'),
    textB: document.getElementById('textB'),
    countA: document.getElementById('countA'),
    countB: document.getElementById('countB'),
    compareBtn: document.getElementById('compareBtn'),
    ignoreCase: document.getElementById('ignoreCase'),
    ignoreWhitespace: document.getElementById('ignoreWhitespace'),
    pillCase: document.getElementById('pillCase'),
    pillSpace: document.getElementById('pillSpace'),
    viewSide: document.getElementById('viewSide'),
    viewUnified: document.getElementById('viewUnified'),
    sampleBtn: document.getElementById('sampleBtn'),
    swapBtn: document.getElementById('swapBtn'),
    clearBtn: document.getElementById('clearBtn'),
    copyBtn: document.getElementById('copyBtn'),
    statsBar: document.getElementById('statsBar'),
    statSim: document.getElementById('statSim'),
    statAdd: document.getElementById('statAdd'),
    statDel: document.getElementById('statDel'),
    statMod: document.getElementById('statMod'),
    statChars: document.getElementById('statChars'),
    linkAdd: document.getElementById('linkAdd'),
    linkDel: document.getElementById('linkDel'),
    linkMod: document.getElementById('linkMod'),
    resultEmpty: document.getElementById('resultEmpty'),
    resultCard: document.getElementById('resultCard'),
    resultHeadLabel: document.getElementById('resultHeadLabel'),
    diffGrid: document.getElementById('diffGrid'),
  };

  let viewMode = 'side';
  let lastRows = null;

  function updateCounts() {
    els.countA.textContent = Array.from(els.textA.value).length.toLocaleString('ja-JP') + ' 文字';
    els.countB.textContent = Array.from(els.textB.value).length.toLocaleString('ja-JP') + ' 文字';
  }

  function updatePillState() {
    els.pillCase.classList.toggle('checked', els.ignoreCase.checked);
    els.pillSpace.classList.toggle('checked', els.ignoreWhitespace.checked);
  }

  // Tracks which row-kind anchors ('add' | 'del' | 'mod') have appeared yet,
  // so the first occurrence of each can get an id for the stat-chip jump links.
  function firstOccurrenceId(kind, seen) {
    if (seen.has(kind)) return '';
    seen.add(kind);
    return ' id="first-' + kind + '"';
  }

  function renderSide(rows) {
    let html = '';
    const seen = new Set();
    for (const r of rows) {
      const rowClass =
        r.kind === 'equal' ? 'row-equal' :
        r.kind === 'add' ? 'row-add' :
        r.kind === 'del' ? 'row-del' :
        'row-mod';
      const idAttr = r.kind === 'equal' ? '' : firstOccurrenceId(r.kind, seen);
      html += '<div class="grid-row"' + idAttr + ' style="display:contents">';
      if (r.kind === 'mod') {
        html += '<div class="ln row-mod-del">' + (r.aNum ?? '') + '</div>';
        html += '<div class="cell row-mod-del">' + r.aHtml + '</div>';
        html += '<div class="gap"></div>';
        html += '<div class="ln row-mod-add">' + (r.bNum ?? '') + '</div>';
        html += '<div class="cell row-mod-add">' + r.bHtml + '</div>';
      } else if (r.kind === 'del') {
        html += '<div class="ln ' + rowClass + '">' + r.aNum + '</div>';
        html += '<div class="cell ' + rowClass + '">' + r.aHtml + '</div>';
        html += '<div class="gap"></div>';
        html += '<div class="ln blank-b"></div>';
        html += '<div class="cell blank-b"></div>';
      } else if (r.kind === 'add') {
        html += '<div class="ln blank-a"></div>';
        html += '<div class="cell blank-a"></div>';
        html += '<div class="gap"></div>';
        html += '<div class="ln ' + rowClass + '">' + r.bNum + '</div>';
        html += '<div class="cell ' + rowClass + '">' + r.bHtml + '</div>';
      } else {
        html += '<div class="ln ' + rowClass + '">' + r.aNum + '</div>';
        html += '<div class="cell ' + rowClass + '">' + r.aHtml + '</div>';
        html += '<div class="gap"></div>';
        html += '<div class="ln ' + rowClass + '">' + r.bNum + '</div>';
        html += '<div class="cell ' + rowClass + '">' + r.bHtml + '</div>';
      }
      html += '</div>';
    }
    els.diffGrid.className = 'diff-grid side';
    els.diffGrid.innerHTML = html;
  }

  function renderUnified(rows) {
    let html = '';
    const seen = new Set();
    for (const r of rows) {
      const idAttr = r.kind === 'equal' ? '' : firstOccurrenceId(r.kind, seen);
      html += '<div class="grid-row"' + idAttr + ' style="display:contents">';
      if (r.kind === 'equal') {
        html += '<div class="ln row-equal">' + (r.aNum ?? '') + '</div>';
        html += '<div class="ln row-equal">' + (r.bNum ?? '') + '</div>';
        html += '<div class="marker row-equal"></div>';
        html += '<div class="cell row-equal">' + r.aHtml + '</div>';
      } else if (r.kind === 'del') {
        html += '<div class="ln row-del">' + r.aNum + '</div>';
        html += '<div class="ln row-del"></div>';
        html += '<div class="marker row-del">−</div>';
        html += '<div class="cell row-del">' + r.aHtml + '</div>';
      } else if (r.kind === 'add') {
        html += '<div class="ln row-add"></div>';
        html += '<div class="ln row-add">' + r.bNum + '</div>';
        html += '<div class="marker row-add">＋</div>';
        html += '<div class="cell row-add">' + r.bHtml + '</div>';
      } else {
        html += '<div class="ln row-mod-del">' + r.aNum + '</div>';
        html += '<div class="ln row-mod-del"></div>';
        html += '<div class="marker row-mod-del">−</div>';
        html += '<div class="cell row-mod-del">' + r.aHtml + '</div>';
        html += '<div class="ln row-mod-add"></div>';
        html += '<div class="ln row-mod-add">' + r.bNum + '</div>';
        html += '<div class="marker row-mod-add">＋</div>';
        html += '<div class="cell row-mod-add">' + r.bHtml + '</div>';
      }
      html += '</div>';
    }
    els.diffGrid.className = 'diff-grid unified';
    els.diffGrid.innerHTML = html;
  }

  function scrollToFirst(kind) {
    const el = document.getElementById('first-' + kind);
    if (!el) return;
    // The wrapper is `display: contents` (no layout box of its own), so
    // scrollIntoView must target an actual rendered child, not the wrapper.
    const target = el.firstElementChild || el;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    el.classList.remove('flash');
    // restart the animation even if the same target is clicked twice in a row
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1200);
  }

  function render() {
    if (viewMode === 'side') renderSide(lastRows);
    else renderUnified(lastRows);
    els.resultHeadLabel.textContent = viewMode === 'side' ? '左右比較表示' : '統合表示';
  }

  function runCompare() {
    const rawA = els.textA.value;
    const rawB = els.textB.value;
    const linesA = splitLines(rawA);
    const linesB = splitLines(rawB);
    const ignoreCase = els.ignoreCase.checked;
    const ignoreWhitespace = els.ignoreWhitespace.checked;

    const { rows, stats } = buildRows(linesA, linesB, ignoreCase, ignoreWhitespace);
    lastRows = rows;
    render();

    els.resultEmpty.style.display = 'none';
    els.resultCard.classList.add('visible');
    els.statsBar.classList.add('visible');

    const totalChars = stats.totalCharsA + stats.totalCharsB;
    const sim = totalChars === 0 ? 100 : Math.round((stats.matchedChars / totalChars) * 100);
    els.statSim.textContent = sim + '%';
    els.statAdd.textContent = stats.added.toLocaleString('ja-JP') + ' 行';
    els.statDel.textContent = stats.deleted.toLocaleString('ja-JP') + ' 行';
    els.statMod.textContent = stats.modified.toLocaleString('ja-JP') + ' 行';
    els.statChars.textContent = 'A ' + Array.from(rawA).length.toLocaleString('ja-JP') + ' / B ' + Array.from(rawB).length.toLocaleString('ja-JP');

    els.linkAdd.disabled = stats.added === 0;
    els.linkDel.disabled = stats.deleted === 0;
    els.linkMod.disabled = stats.modified === 0;
  }

  function buildUnifiedText() {
    if (!lastRows) return '';
    const lines = [];
    for (const r of lastRows) {
      if (r.kind === 'equal') lines.push('  ' + (r.aHtml ? stripTags(r.aHtml) : ''));
      else if (r.kind === 'del') lines.push('- ' + stripTags(r.aHtml));
      else if (r.kind === 'add') lines.push('+ ' + stripTags(r.bHtml));
      else {
        lines.push('- ' + stripTags(r.aHtml));
        lines.push('+ ' + stripTags(r.bHtml));
      }
    }
    return lines.join('\n');
  }

  function stripTags(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    return div.textContent;
  }

  /* ================= Events ================= */

  els.textA.addEventListener('input', updateCounts);
  els.textB.addEventListener('input', updateCounts);
  els.compareBtn.addEventListener('click', runCompare);

  els.ignoreCase.addEventListener('change', () => { updatePillState(); if (lastRows) runCompare(); });
  els.ignoreWhitespace.addEventListener('change', () => { updatePillState(); if (lastRows) runCompare(); });

  els.viewSide.addEventListener('click', () => {
    viewMode = 'side';
    els.viewSide.classList.add('active');
    els.viewUnified.classList.remove('active');
    if (lastRows) render();
  });
  els.viewUnified.addEventListener('click', () => {
    viewMode = 'unified';
    els.viewUnified.classList.add('active');
    els.viewSide.classList.remove('active');
    if (lastRows) render();
  });

  els.linkAdd.addEventListener('click', () => scrollToFirst('add'));
  els.linkDel.addEventListener('click', () => scrollToFirst('del'));
  els.linkMod.addEventListener('click', () => scrollToFirst('mod'));

  els.swapBtn.addEventListener('click', () => {
    const tmp = els.textA.value;
    els.textA.value = els.textB.value;
    els.textB.value = tmp;
    updateCounts();
    if (lastRows) runCompare();
  });

  els.clearBtn.addEventListener('click', () => {
    els.textA.value = '';
    els.textB.value = '';
    updateCounts();
    lastRows = null;
    els.resultCard.classList.remove('visible');
    els.statsBar.classList.remove('visible');
    els.resultEmpty.style.display = 'block';
    els.linkAdd.disabled = true;
    els.linkDel.disabled = true;
    els.linkMod.disabled = true;
  });

  els.sampleBtn.addEventListener('click', () => {
    els.textA.value = '吾輩は猫である。名前はまだ無い。\nどこで生れたかとんと見当がつかぬ。\n何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。\n吾輩はここで始めて人間というものを見た。\nしかもあとで聞くとそれは書生という人間中で一番獰悪な種族であったそうだ。\nこの書生というのは時々我々を捕えて煮て食うという話である。';
    els.textB.value = '吾輩は猫である。名前はまだ無い。\nどこで生まれたのか、とんと見当がつかない。\n何でも薄暗く、じめじめした場所でニャーニャー泣いていたことだけは記憶している。\n吾輩はここで初めて人間というものを見た。\nしかもあとで聞くと、それは書生という人間の中で一番獰悪な種族であったそうだ。\nこの書生というのは、時々我々を捕まえて煮て食うという話である。\n猫の額ほどの庭にも、時々姿を見せていた。';
    updateCounts();
    runCompare();
  });

  els.copyBtn.addEventListener('click', async () => {
    if (!lastRows) return;
    const text = buildUnifiedText();
    try {
      await navigator.clipboard.writeText(text);
      const original = els.copyBtn.textContent;
      els.copyBtn.textContent = 'コピーしました';
      setTimeout(() => { els.copyBtn.textContent = original; }, 1500);
    } catch (e) {
      const original = els.copyBtn.textContent;
      els.copyBtn.textContent = 'コピーできません';
      setTimeout(() => { els.copyBtn.textContent = original; }, 1500);
    }
  });

  const toTopBtn = document.getElementById('toTopBtn');
  window.addEventListener('scroll', () => {
    toTopBtn.classList.toggle('visible', window.scrollY > 400);
  }, { passive: true });
  toTopBtn.addEventListener('click', () => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  });

  updateCounts();
  updatePillState();
})();
</script>
</body>
</html>
